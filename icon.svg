<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- 主背景渐变 - 飞书蓝 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3370FF"/>
      <stop offset="100%" style="stop-color:#1E4FD9"/>
    </linearGradient>
    <!-- AI 徽章渐变 -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#73D1FF"/>
      <stop offset="100%" style="stop-color:#3370FF"/>
    </linearGradient>
    <!-- 数据条渐变 -->
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.7)"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.5)"/>
    </linearGradient>
    <!-- 外发光 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角方形背景（飞书风格） -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bgGrad)"/>

  <!-- 数据图表 - 柱状图 -->
  <g transform="translate(28, 38)">
    <!-- 柱状图底座 -->
    <rect x="0" y="40" width="72" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>

    <!-- 柱子 1 -->
    <rect x="4" y="20" width="14" height="20" rx="3" fill="url(#bar1)" opacity="0.9">
      <animate attributeName="height" values="16;20;16" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="24;20;24" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- 柱子 2 -->
    <rect x="22" y="8" width="14" height="32" rx="3" fill="url(#bar2)" opacity="0.75">
      <animate attributeName="height" values="28;32;28" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="12;8;12" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- 柱子 3 -->
    <rect x="40" y="14" width="14" height="26" rx="3" fill="url(#bar1)" opacity="0.9">
      <animate attributeName="height" values="22;26;22" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="18;14;18" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- 柱子 4 -->
    <rect x="58" y="24" width="14" height="16" rx="3" fill="url(#bar2)" opacity="0.75">
      <animate attributeName="height" values="12;16;12" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="28;24;28" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- AI 角标 -->
  <g transform="translate(74, 22)" filter="url(#glow)">
    <rect x="-18" y="-14" width="36" height="28" rx="14" fill="url(#badgeGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial, sans-serif">AI</text>
  </g>

  <!-- 装饰：左上角小圆点 -->
  <circle cx="22" cy="22" r="3" fill="rgba(255,255,255,0.3)"/>
  <!-- 装饰：右上角小圆点 -->
  <circle cx="100" cy="46" r="2.5" fill="rgba(255,255,255,0.2)"/>
  <!-- 装饰：右下角小圆点 -->
  <circle cx="100" cy="100" r="3" fill="rgba(255,255,255,0.25)"/>
  <!-- 装饰：左下角小圆点 -->
  <circle cx="28" cy="102" r="2" fill="rgba(255,255,255,0.2)"/>

  <!-- 数据连线（代表趋势分析） -->
  <polyline points="32,58 40,46 48,50 56,38 64,42 72,30" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
