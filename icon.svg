<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  <!-- AI 数据图标 -->
  <g transform="translate(32, 28)">
    <!-- 数据库圆柱 -->
    <ellipse cx="32" cy="10" rx="28" ry="6" fill="rgba(255,255,255,0.3)"/>
    <path d="M4 10 L4 48 Q4 58 32 58 Q60 58 60 48 L60 10" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <ellipse cx="32" cy="48" rx="28" ry="6" fill="rgba(255,255,255,0.15)"/>
    <ellipse cx="32" cy="10" rx="28" ry="6" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <!-- 数据线条 -->
    <rect x="14" y="24" width="8" height="16" rx="2" fill="rgba(255,255,255,0.8)"/>
    <rect x="26" y="20" width="8" height="20" rx="2" fill="rgba(255,255,255,0.6)"/>
    <rect x="38" y="28" width="8" height="12" rx="2" fill="rgba(255,255,255,0.7)"/>
  </g>
  <!-- AI 星形标记 -->
  <g transform="translate(72, 20)">
    <circle cx="0" cy="0" r="14" fill="url(#bg2)" opacity="0.95"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="Arial">AI</text>
  </g>
  <!-- 装饰点 -->
  <circle cx="28" cy="22" r="2.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="102" cy="40" r="2" fill="rgba(255,255,255,0.4)"/>
  <circle cx="98" cy="90" r="2.5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="30" cy="100" r="2" fill="rgba(255,255,255,0.3)"/>
</svg>
